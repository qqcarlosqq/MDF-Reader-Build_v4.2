name: Build MDF Reader v4.2 for Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build executable
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean MDF_Reader_v4_2.spec
      - name: Test executable
        shell: pwsh
        run: |
          .\dist\MDF_Reader_v4_2.exe --self-test | Tee-Object -FilePath .\dist\self_test.txt
          if (-not (Select-String -Path .\dist\self_test.txt -Pattern "SELF_TEST_OK" -Quiet)) { throw "Self-test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: MDF_Reader_v4_2_Windows_x64
          path: |
            dist/MDF_Reader_v4_2.exe
            dist/self_test.txt
          if-no-files-found: error
          retention-days: 30
